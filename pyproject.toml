[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-long-commute"
version = "0.1.0"
description = "Find the ZVV station pair with the longest fastest train journey"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
long-commute = "long_commute.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
